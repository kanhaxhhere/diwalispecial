function main(){
const T=THREE,PI=Math.PI,rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.random()*a.length|0],AD=T.AdditiveBlending;

const cv=(w,h,f)=>{const c=document.createElement('canvas');c.width=w;c.height=h;f(c.getContext('2d'),w,h);return c};
const tex=c=>new T.CanvasTexture(c);
const glow=tex(cv(64,64,(x)=>{const g=x.createRadialGradient(32,32,0,32,32,32);g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.3,'rgba(255,255,255,.5)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(0,0,64,64)}));
const pts=(a,col,size,op,fog)=>{const g=new T.BufferGeometry();g.setAttribute('position',new T.Float32BufferAttribute(a,3));const m=new T.PointsMaterial({map:glow,color:col,size,transparent:true,opacity:op,blending:AD,depthWrite:false,fog:fog!==false});const p=new T.Points(g,m);p.frustumCulled=false;S.add(p);return m};
const D=new T.Object3D(),MB=c=>new T.MeshBasicMaterial({color:c}),MC={},LM=c=>MC[c]||(MC[c]=new T.MeshLambertMaterial({color:c}));
const SP=r=>new T.SphereGeometry(r,14,10),spr=(c,sz,op)=>{const q=new T.Sprite(new T.SpriteMaterial({map:glow,color:c,blending:AD,transparent:true,depthWrite:false,opacity:op===undefined?1:op}));q.scale.set(sz,sz,1);return q};
function inst(geo,mat,arr){const m=new T.InstancedMesh(geo,mat,arr.length);arr.forEach((a,i)=>{D.position.set(a[0],a[1],a[2]);D.scale.set(a[3],a[4],a[5]);D.rotation.set(0,a[6]||0,0);D.updateMatrix();m.setMatrixAt(i,D.matrix);if(a[7]!==undefined)m.setColorAt(i,new T.Color(a[7]))});m.instanceMatrix.needsUpdate=true;if(m.instanceColor)m.instanceColor.needsUpdate=true;m.frustumCulled=false;S.add(m);return m}
// ---- city grid: 5 north-south lanes x 6 east-west lanes
const GX=[-48,-24,0,24,48],GZ=[30,6,-18,-42,-66,-90],X0=-58,X1=58,Z0=-100,Z1=36;
const nearG=(v,G,d)=>G.some(g=>Math.abs(v-g)<d);
const free=(x,z,m)=>GX.some(g=>Math.abs(x-g)<=4-m&&z>=Z0+m&&z<=Z1-m)||GZ.some(g=>Math.abs(z-g)<=4-m&&x>=X0+m&&x<=X1-m)||(x>=5+m&&x<=19-m&&z>=-26.8+m&&z<=-22);
const rp=()=>{if(Math.random()<.55){const z=rnd(-94,30);return{x:pick(GX)+rnd(-2,2),z:nearG(z,GZ,5)?z+6:z,ns:1}}const x=rnd(-52,52);return{x:nearG(x,GX,5)?x+6:x,z:pick(GZ)+rnd(-2,2),ns:0}};

brick.wrapS=brick.wrapT=T.RepeatWrapping;brick.repeat.set(4,68);
const b2=brick.clone();b2.needsUpdate=true;b2.repeat.set(4,58);
const gr=new T.Mesh(new T.PlaneGeometry(500,500),LM(0x2a1218));gr.rotation.x=-PI/2;gr.position.y=-.03;S.add(gr);

GZ.forEach(g=>{const m=new T.Mesh(new T.PlaneGeometry(8,116),new T.MeshLambertMaterial({map:b2}));m.rotation.set(-PI/2,0,PI/2);m.position.set(0,.02,g);S.add(m)});
const plz=new T.Mesh(new T.PlaneGeometry(16,16),LM(0xd9c3a0));plz.rotation.x=-PI/2;plz.position.set(12,.03,-30);S.add(plz);
const mel=new T.Mesh(new T.PlaneGeometry(16,16),LM(0x6b4a2a));mel.rotation.x=-PI/2;mel.position.set(-12,.03,-6);S.add(mel);
const pal=[0xc2185b,0x00897b,0x1e4fa8,0xe65100,0xd84315,0x6a1b9a,0xff7043,0x0277bd,0xf9a825,0x2e7d32];
const winT=tex(cv(64,96,(x,w,h)=>{x.fillStyle='#ffcf5a';x.fillRect(0,0,w,h);x.strokeStyle='#7a3b00';x.lineWidth=4;x.strokeRect(2,2,w-4,h-4);for(let i=1;i<3;i++){x.beginPath();x.moveTo(i*w/3,0);x.lineTo(i*w/3,h);x.stroke()}for(let i=1;i<4;i++){x.beginPath();x.moveTo(0,i*h/4);x.lineTo(w,i*h/4);x.stroke()}x.fillStyle='#ff9a1a';x.beginPath();x.arc(w/2,h/2,9,0,6.3);x.fill()}));
const doorT=tex(cv(64,96,(x,w,h)=>{x.fillStyle='#3b1c0c';x.fillRect(0,0,w,h);x.strokeStyle='#d4a017';x.lineWidth=3;x.strokeRect(3,3,w-6,h-6);x.strokeRect(10,10,w-20,34);x.strokeRect(10,52,w-20,34);x.fillStyle='#ffd54f';x.beginPath();x.arc(w-14,h/2,3,0,6.3);x.fill()}));
// kid spots (diya rows) decided first so diyas exist
const KS=[];for(let i=0;i<12;i++){const p=rp();p.ry=rnd(0,6.28);KS.push(p)}
const HB=[],Wn=[],Dr=[],Bs=[],Rl=[],Aw=[],Gp=[],Dy=[],Pt=[],Pl=[],BP=[];
GX.slice(0,-1).forEach((x0,i)=>GZ.slice(0,-1).forEach((z0,j)=>{if((i==2&&j==2)||(i==1&&j==1))return;const bx=(x0+GX[i+1])/2,bz=(z0+GZ[j+1])/2;
for(const sx of[-1,1])for(const sz of[-1,1]){const cx=bx+sx*4,cz=bz+sz*4,h=(i==2&&j==0&&sx==-1&&sz==-1)?10:7+Math.floor(Math.random()*7),c=pick(pal),fl=Math.floor(h/3.1);
HB.push([cx,h/2,cz,8,h,8,0,c],[cx,.55,cz,8.14,1.1,8.14,0,0x4a2a20],[cx,h+.22,cz,8.5,.45,8.5,0,0xffe0b0],[cx,h+.65,cz,8.1,.45,8.1,0,c]);
for(const[nx,nz]of[[sx,0],[0,sz]]){const ry=nx?nx*PI/2:(nz>0?0:PI),fx=cx+nx*4,fz=cz+nz*4,ax=nx?0:1,az=nx?1:0,P=(a,y,o)=>[fx+ax*a+nx*o,y,fz+az*a+nz*o];
for(let f=0;f<fl;f++){for(const a of[-2.1,2.1])Wn.push([...P(a,2.5+f*3.1,.03),1.2,1.7,1,ry]);
if(f>0&&!(i==2&&j==0&&sx==-1&&sz==-1)){Bs.push([...P(0,f*3.1+.9,.6),nx?1.1:6.6,.14,nx?6.6:1.1,0,0x3a2a20]);Rl.push([...P(0,f*3.1+1.4,1.12),nx?.07:6.6,.9,nx?6.6:.07,0]);
if(Math.random()<.55)for(const a of[-2.6,-1.3,0,1.3,2.6])Dy.push([...P(a,f*3.1+.98,.95),1,1,1]);
if(BP.length<12&&Math.random()<.2)BP.push([...P(rnd(-2,2),f*3.1+.97,.5),Math.atan2(nx,nz)])}}
Dr.push([...P(0,1.25,.03),1.7,2.5,1,ry]);
for(let k=0;k<9;k++){const u=k/8;Gp.push([fx+ax*(-1+u*2)+nx*.2,2.9-Math.sin(u*PI)*.4,fz+az*(-1+u*2)+nz*.2,.15,.15,.15,0,k%2?0xff9a1a:0xffc21a])}
if(Math.random()<.5)Aw.push([...P(0,3,.55),nx?1:3.6,.1,nx?3.6:1,0,pick(pal)]);
for(const a of[-1.7,1.7]){Pt.push([...P(a,.25,.55),.3,.5,.3,0]);Pl.push([...P(a,.75,.55),.4,.4,.4,0,pick([0x2e7d32,0xff9800,0xff9800])])}
for(const a of[-1.2,1.2])Dy.push([...P(a,.07,1.3),1,1,1])}}}));
for(let i=-5;i<=5;i++)if(Math.abs(i)>1)Dy.push([12+i*1.1,1.05,-31.7,1,1,1]);
for(let v=0;v<=6;v++)Dy.push([4.6+v*1.13,10.95,10.7,1,1,1],[4.6+v*1.13,10.95,17.3,1,1,1]);for(let v=1;v<=5;v++)Dy.push([4.6,10.95,10.7+v*1.1,1,1,1],[11.4,10.95,10.7+v*1.1,1,1,1]);
const LD=[[3.78,5.45,14.95,.1,10.9,.1,0],[3.78,5.45,15.45,.1,10.9,.1,0]];for(let i=0;i<21;i++)LD.push([3.78,.4+i*.5,15.2,.08,.08,.5,0]);inst(new T.BoxGeometry(1,1,1),LM(0x8a5a2a),LD);
const RE=(ns,c,a,b)=>{for(let v=a;v<b;v+=2.4)for(const s of[-1,1]){const x=ns?c+s*3.7:v,z=ns?v:c+s*3.7;if(ns?nearG(z,GZ,4.4):nearG(x,GX,4.4))continue;Dy.push([x,.07,z,1,1,1])}};
GX.forEach(g=>RE(1,g,Z0+2,Z1));GZ.forEach(g=>RE(0,g,X0+2,X1));
KS.forEach(k=>{const fx=Math.sin(k.ry),fz=Math.cos(k.ry);for(let q=0;q<5;q++)Dy.push([k.x+fx*.8+fz*(q-2)*.36,.07,k.z+fz*.8-fx*(q-2)*.36,1,1,1])});
inst(new T.BoxGeometry(1,1,1),LM(0xffffff),HB);
inst(new T.PlaneGeometry(1,1),new T.MeshBasicMaterial({map:winT}),Wn);
inst(new T.PlaneGeometry(1,1),new T.MeshLambertMaterial({map:doorT}),Dr);
inst(new T.BoxGeometry(1,1,1),LM(0xffffff),Bs);inst(new T.BoxGeometry(1,1,1),LM(0x111111),Rl);inst(new T.BoxGeometry(1,1,1),LM(0xffffff),Aw);
inst(new T.SphereGeometry(1,6,5),MB(0xffffff),Gp);
inst(new T.CylinderGeometry(.5,.4,1,8),LM(0xb5532a),Pt);inst(new T.SphereGeometry(1,7,6),LM(0xffffff),Pl);
inst(new T.CylinderGeometry(.15,.1,.1,8),LM(0xc4571f),Dy);
const dg=[],pool=[];Dy.forEach(a=>{dg.push(a[0],a[1]+.12,a[2]);if(a[1]<.5)pool.push(a[0],.03,a[2])});
const flame=pts(dg,0xffa030,.55,.9),poolM=pts(pool,0xff7a20,4,.16);
// ---- ferris wheel mela
const WH=new T.Group();WH.position.set(-12,7.6,-6);S.add(WH);WH.add(new T.Mesh(new T.TorusGeometry(6,.14,6,40),MB(0xffd27a)));
for(let i=0;i<5;i++){const q=new T.Mesh(new T.BoxGeometry(.08,12,.08),MB(0xe0b050));q.rotation.z=i*PI/5;WH.add(q)}
const GD=[];for(let i=0;i<10;i++){const a=i/10*2*PI,g=new T.Group();g.position.set(Math.cos(a)*6,Math.sin(a)*6,0);const b=new T.Mesh(new T.BoxGeometry(.9,.7,.7),MB(pick([0xff4081,0x40c4ff,0xffeb3b,0x69f0ae,0xff9100])));b.position.y=-.4;g.add(b);const s=spr(0xffcf70,2.2,.8);s.position.y=-.4;g.add(s);WH.add(g);GD.push(g)}
for(const s of[-1,1]){const q=new T.Mesh(new T.BoxGeometry(.3,8.4,.3),LM(0x5a3a2a));q.position.set(-12+s*2.4,3.8,-6);q.rotation.z=-s*.3;S.add(q)}
// ---- temple
const TG=new T.Group();TG.position.set(12,0,-34.5);S.add(TG);TG.scale.set(1,1.6,1);
const tb=(w,h,d,c,x,y,z)=>{const q=new T.Mesh(new T.BoxGeometry(w,h,d),LM(c));q.position.set(x,y,z);TG.add(q);return q};
